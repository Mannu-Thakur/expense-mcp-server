# render.yaml — Expense MCP Server
# Blueprint spec: https://render.com/docs/blueprint-spec
#
# IMPORTANT: Render Postgres databases must be defined under the top-level
# `databases:` key, NOT inside `services:`. The `type: pserv` value means
# "private app service" — it is NOT PostgreSQL.

# ── Web Services ───────────────────────────────────────────────────────────────
services:
  - type: web
    name: expense-mcp-server
    runtime: docker          # Use the Dockerfile (handles psycopg2/libpq cleanly)
    plan: free
    region: singapore

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: TRANSPORT
        value: streamable-http

      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: 10000

      - key: MCP_SERVER_NAME
        value: Expense Tracker

      - key: DATABASE_URL
        fromDatabase:
          name: expense-db
          property: connectionString

      # Supply these values from the identity provider before enabling HTTP.
      # On an existing Blueprint service, add them manually in the Render
      # Dashboard: sync:false only prompts during the initial Blueprint setup.
      - key: OAUTH_ISSUER_URL
        sync: false
      - key: OAUTH_JWKS_URL
        sync: false
      - key: OAUTH_AUDIENCE
        sync: false
      - key: OAUTH_RESOURCE_URL
        sync: false
      - key: OAUTH_JWT_ALGORITHM
        value: RS256

# ── PostgreSQL Databases ───────────────────────────────────────────────────────
# Render Postgres must be defined here, under `databases:` — never in `services:`
databases:
  - name: expense-db
    # Free is for demos only: Render free Postgres expires after 30 days and has no backups.
    plan: free
    region: singapore
