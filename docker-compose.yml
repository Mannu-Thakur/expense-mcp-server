services:
  postgres:
    image: postgres:16-alpine
    container_name: expense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_db
      POSTGRES_USER: expense_user
      # Development-only password. The port is bound to loopback, not the LAN.
      POSTGRES_PASSWORD: expense_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
