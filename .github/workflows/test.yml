name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_test
          POSTGRES_USER: expense_user
          POSTGRES_PASSWORD: expense_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_user -d expense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: production
      TRANSPORT: stdio
      DATABASE_URL: postgresql://expense_user:expense_pass@localhost:5432/expense_test
      TEST_POSTGRES_URL: postgresql://expense_user:expense_pass@localhost:5432/expense_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify production startup against PostgreSQL
        run: python -c "from run import startup; startup()"
      - name: Run unit and integration tests
        run: python -m pytest -q
